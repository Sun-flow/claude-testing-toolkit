# Testing kit CI ({{STACK}}). Pin every action to a full commit SHA in real use
# (keep the tag as a comment); tags are shown here for readability.
name: testing-kit
on:
  pull_request:
    # labeled/unlabeled: adding `allow-test-changes` re-runs the gates
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [{{BRANCHES}}]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 0}
      {{CI_SETUP}}
      - name: Fast tier
        run: |
          {{FAST_YAML}}
      - name: Test report
        # Reads the JUnit file named by junit_path in .claude/testing-kit.json, if the runner writes one.
        if: ${{ !cancelled() }}
        run: python3 .claude/testing-kit/test_report.py || true
      - name: Diff coverage (changed lines)
        # Runs only when the fast tier writes a coverage report (e.g. pytest --cov --cov-report=xml,
        # or vitest/jest --coverage with the cobertura reporter).
        if: github.event_name == 'pull_request' && hashFiles('{{COVERAGE_XML}}') != ''
        env: {BASE_REF: "${{ github.base_ref }}"}
        run: pipx run diff-cover {{COVERAGE_XML}} --compare-branch="origin/$BASE_REF" --fail-under=90
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with: {name: junit, path: "{{REPORT_DIR}}", if-no-files-found: ignore, include-hidden-files: true}

  test-guard:
    # Did this branch delete, skip, loosen or regenerate tests, or change test config?
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 0}
      - env:
          BASE_REF: ${{ github.base_ref }}
          ALLOW_TEST_CHANGES: ${{ contains(github.event.pull_request.labels.*.name, 'allow-test-changes') && '1' || '0' }}
        run: |
          # Run the gate from the base branch's copy when it has one, so a PR can't edit its own gate.
          KIT=.claude/testing-kit
          if git cat-file -e "origin/$BASE_REF:.claude/testing-kit/kitlib.py" 2>/dev/null; then
            mkdir -p "$RUNNER_TEMP/kit"
            git archive "origin/$BASE_REF" .claude/testing-kit | tar -x -C "$RUNNER_TEMP/kit"
            KIT="$RUNNER_TEMP/kit/.claude/testing-kit"
          fi
          python3 "$KIT/test_diff_guard.py" --base "origin/$BASE_REF"

  base-tests:
    # The base branch's tests (and harness) must still pass against this branch's code.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 0}
      {{CI_SETUP}}
      - env:
          BASE_REF: ${{ github.base_ref }}
          ALLOW_TEST_CHANGES: ${{ contains(github.event.pull_request.labels.*.name, 'allow-test-changes') && '1' || '0' }}
        run: |
          # Run the gate from the base branch's copy when it has one, so a PR can't edit its own gate.
          KIT=.claude/testing-kit
          if git cat-file -e "origin/$BASE_REF:.claude/testing-kit/kitlib.py" 2>/dev/null; then
            mkdir -p "$RUNNER_TEMP/kit"
            git archive "origin/$BASE_REF" .claude/testing-kit | tar -x -C "$RUNNER_TEMP/kit"
            KIT="$RUNNER_TEMP/kit/.claude/testing-kit"
          fi
          python3 "$KIT/base_tests.py" --base "origin/$BASE_REF"

  all-green:
    # Make THIS the one required status check in the branch ruleset.
    if: always()
    needs: [test, test-guard, base-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: test-guard, base-tests
